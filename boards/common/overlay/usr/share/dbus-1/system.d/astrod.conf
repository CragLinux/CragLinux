<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Astro: D-Bus policy for astrod (docs/09 §5, docs/06 §2).

     astrod runs unprivileged (user astrod, docs/02 §7) and drives RAUC
     over the system bus for the /api/v1/update endpoint group. This
     policy grants exactly that: method calls to the de.pengutronix.rauc
     service (the Installer interface plus the standard Properties/
     Introspectable/Peer plumbing sd-bus uses), and nothing else.

     Deliberately absent:
       - no <allow own=...>: astrod claims no bus name; its surface is
         HTTP, not D-Bus.
       - no default-context grants: this file must not widen access for
         any other user (rauc's own policy governs who else may talk to
         it; docs/09 §5 default-deny stance).
     Signal reception (PropertiesChanged / Completed) needs no grant:
     dbus-daemon's default policy allows receiving broadcast signals. -->
<busconfig>
  <policy user="astrod">
    <allow send_destination="de.pengutronix.rauc"
           send_interface="de.pengutronix.rauc.Installer"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="org.freedesktop.DBus.Peer"/>
    <!-- M3 phase 3: the network endpoint group drives iwd (docs/07 §2,
         wifi.zig). iwd's own policy (iwd-dbus.conf) default-denies
         send_destination=net.connman.iwd for non-root; this user policy
         overrides it with exactly the interfaces wifi.zig calls —
         found live as org.freedesktop.DBus.Error.AccessDenied on
         Station.Scan (the denial was MASKED on GetOrderedNetworks by
         the model fallback and on Network.Connect by iwd's own
         autoconnect from the rendered profile). -->
    <allow send_destination="net.connman.iwd"
           send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="net.connman.iwd"
           send_interface="net.connman.iwd.Station"/>
    <allow send_destination="net.connman.iwd"
           send_interface="net.connman.iwd.StationDiagnostic"/>
    <allow send_destination="net.connman.iwd"
           send_interface="net.connman.iwd.Network"/>
    <allow send_destination="net.connman.iwd"
           send_interface="net.connman.iwd.KnownNetwork"/>
    <!-- M3 phase 4: the provisioning AP (docs/07 §4, wifi.zig apStart/
         apStop) calls AccessPoint.StartProfile/Stop on the AP radio.
         Found live as org.freedesktop.DBus.Error.AccessDenied on
         StartProfile in the provisioning-e2e case — the Device.Mode
         flip itself was NOT denied (it rides Properties.Set, already
         allowed below), so the radio wedged in ap mode with no AP
         running until this grant landed. -->
    <allow send_destination="net.connman.iwd"
           send_interface="net.connman.iwd.AccessPoint"/>
    <allow send_destination="net.connman.iwd"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="net.connman.iwd"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="net.connman.iwd"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
