<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Astro: D-Bus policy for astrod (docs/09 §5, docs/06 §2).

     astrod runs unprivileged (user astrod, docs/02 §7) and drives RAUC
     over the system bus for the /api/v1/update endpoint group. This
     policy grants exactly that: method calls to the de.pengutronix.rauc
     service (the Installer interface plus the standard Properties/
     Introspectable/Peer plumbing sd-bus uses), and nothing else.

     Deliberately absent:
       - no <allow own=...>: astrod claims no bus name; its surface is
         HTTP, not D-Bus.
       - no default-context grants: this file must not widen access for
         any other user (rauc's own policy governs who else may talk to
         it; docs/09 §5 default-deny stance).
     Signal reception (PropertiesChanged / Completed) needs no grant:
     dbus-daemon's default policy allows receiving broadcast signals.

     net.connman.iwd access for the network endpoint group is a separate
     grant added in M3 phase 3, not here. -->
<busconfig>
  <policy user="astrod">
    <allow send_destination="de.pengutronix.rauc"
           send_interface="de.pengutronix.rauc.Installer"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
