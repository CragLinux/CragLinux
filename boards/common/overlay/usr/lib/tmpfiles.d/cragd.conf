# astrod runtime state (docs/06 §6, AD-014). Processed by the
# dinit-chimera early-tmpfiles service (sd-tmpfiles --create --boot).
#
# /run/astro: parent dir of the API unix socket. 0750 astrod:astro-api is
# the access gate — the socket file itself is created by unprivileged
# astrod with default umask, so directory traversal (group astro-api) is
# what actually authorizes clients (recorded deviation: socket moved from
# docs/06's /run/astrod.sock so an unprivileged daemon can own the dir).
# bootenv-mount (early-fs-pre) mkdir -p's this dir root-owned before we
# run; 'd' re-owns the existing dir, and root tools (rauc-mark-good,
# fw_setenv) reach /run/astro/bootenv regardless of the 0750 gate.
d /run/astro 0750 astrod astro-api -

# dinit creates its control socket root-only (0600, dinit.cc
# open_control_socket) at early-root-rw.target — strictly before this
# service runs. Group-open it to astrod's PRIMARY group (gid 300, sole
# member: the daemon) so the reboot/poweroff endpoints work unprivileged.
# Deliberately NOT astro-api: that group holds team app users, and a
# group-writable control socket would be exactly the privilege-escalation
# bridge to init that docs/06 §5.4 forbids.
z /run/dinitctl 0660 root astrod -

# Rendered resolv.conf home (docs/07 §2 one-writer model). DELIBERATELY
# OUTSIDE the 0750 /run/astro gate: /etc/resolv.conf symlinks here and
# every user's libc resolver must be able to read it — found live (M3
# phase 4): chronyd, dropped to _chrony, could never resolve the NTP
# pool through the astro-api-gated dir, so time.synced stayed false
# forever with an empty chronyc source list. astrod-owned so the
# unprivileged daemon can atomically rename renders into it.
d /run/astro-resolv 0755 astrod astrod -

# Rendered network configs (docs/07 §2, M3 phase 3). /run/astro/net is
# astrod-owned: netconf.zig renders dhcpcd.conf (and, at
# /run/astro/resolv.conf, the resolv.conf target) here from the store.
# 0755 under the 0750 /run/astro gate: root daemons (dhcpcd) read the
# rendered config by path without astro-api membership; traversal of the
# parent is not required for root.
d /run/astro/net 0755 astrod astrod -

# Lease exports: written BY ROOT (the dhcpcd hook,
# /usr/lib/astro/dhcpcd-hook.sh), read by astrod's inotify watcher —
# hence root-owned and only group-readable for astrod. Deliberately NOT
# astrod-writable: the hook output is trusted root input to astrod's
# resolv.conf rendering, and a compromised astrod must not be able to
# forge it.
d /run/astro/net/leases 0755 root astrod -

# dhcpcd config BOOTSTRAP (see /etc/dinit.d/dhcpcd): before astrod's
# first render, dhcpcd's -f path resolves through this symlink to the
# baked fallback config, so DHCP works on a factory boot with astrod
# down. astrod's first render atomically replaces the symlink with a
# regular file. 'L' not 'L+': /run is tmpfs (the path never pre-exists at
# boot) and the rule must never clobber a rendered file by accident.
L /run/astro/net/dhcpcd.conf - - - - /etc/astro/dhcpcd-fallback.conf

# iwd state (docs/07 §2): astrod-owned so the unprivileged daemon can
# render known-network <ssid>.psk profiles from the store; iwd (root,
# STATE_DIRECTORY=/data/net/iwd via the shadow service) reads them
# regardless of ownership. 0700 matches iwd's own storage expectations.
# Ordering is safe (early-tmpfiles runs after data-mount's target — same
# argument as /data/.astro/staging below).
d /data/net 0755 root root -
d /data/net/iwd 0700 astrod astrod -

# /data/.astro/staging: bundle-upload staging area (docs/05 §5.1; the
# POST /api/v1/update octet-stream form streams bundles here). Created
# every boot so data lifetimes initialized before M3 phase 2 get it too.
# Parent /data/.astro stays root-owned (rauc.status lives there) — which
# is exactly why unprivileged astrod cannot mkdir it itself; root (rauc)
# reads staged bundles regardless of the 0755. Ordering is safe:
# early-tmpfiles runs after the early-fs-local target that data-mount
# belongs to.
d /data/.astro/staging 0755 astrod astrod -

# last-known-time floor (docs/07 §6, M3 phase 4): written by astrod
# (hourly + before deferred shutdowns). Parent /data/.astro stays
# root-owned (rauc.status, firstboot stamps live there), so the file is
# pre-created astrod-owned here — 'f' creates only when absent and never
# rewrites content, so an existing floor value always survives boots.
f /data/.astro/last-known-time 0644 astrod astrod -

# AP-window iwd netconfig override dir (docs/07 §4, M3 phase 4):
# astrod renders /run/astro/iwd/main.conf (EnableNetworkConfiguration=
# true) here for the duration of the provisioning AP, and iwd's
# CONFIGURATION_DIRECTORY (/etc/astro/iwd.env) checks it FIRST. astrod-
# owned so the capless daemon can create/remove it; on /run so a crash
# can never make the split-brain config survive a reboot. 0755: root
# iwd only needs read.
d /run/astro/iwd 0755 astrod astrod -

# AP-mode profiles (docs/07 §4, M3 phase 4): astrod renders
# <ssid>.ap documents (WPA2 passphrase + the [IPv4] DHCP pool) here;
# iwd's AccessPoint.StartProfile loads ap/<ssid>.ap relative to its
# state dir (iwd-3.12 src/ap.c:4437). Same ownership story as the
# parent /data/net/iwd rule above.
d /data/net/iwd/ap 0700 astrod astrod -
