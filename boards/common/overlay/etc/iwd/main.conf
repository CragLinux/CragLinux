# Astro iwd configuration (docs/07 §1, AD-015).
#
# iwd manages WIFI ONLY: no DHCP client, no address assignment, no
# resolv.conf writing. dhcpcd owns addressing on every interface
# (including wlan0) and astrod is the single network policy brain —
# EnableNetworkConfiguration MUST stay false or iwd's built-in DHCP
# client and dhcpcd would fight over wlan0 (split-brain docs/07 §1
# forbids). The phase-4 AP provisioning portal is the one sanctioned
# exception (iwd's AP-mode DHCP server on the portal subnet) and is
# toggled at runtime by astrod, not here.
#
# iwd's state directory (known-network .psk profiles, rendered by astrod
# from the store) is NOT configured here — iwd takes it from the
# STATE_DIRECTORY environment variable (iwd-3.12 src/storage.c), set to
# /data/net/iwd by the shadow dinit service via env-file.

[General]
EnableNetworkConfiguration=false
