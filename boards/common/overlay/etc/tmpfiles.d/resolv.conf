# Crag OVERRIDE of the resolvconf package's tmpfiles rule (docs/07 §2:
# cragd is the ONE resolv.conf writer).
#
# The resolvconf metapackage (a dependency of both dhcpcd and iwd) ships
# /usr/lib/tmpfiles.d/resolv.conf with
#   L+ /etc/resolv.conf - - - - ../run/resolvconf/resolv.conf
# which would force-recreate /etc/resolv.conf every boot pointing into
# openresolv's world — silently undoing the baked Crag symlink exactly
# like base-files' os-release rule did (MIGRATION-NOTES §15). Per
# tmpfiles.d(5), a file in /etc/tmpfiles.d with the same basename
# replaces the /usr/lib one entirely, so this file both neutralizes the
# openresolv rule and re-asserts the Crag target each boot.
#
# The symlink is ALSO baked into the image by the rootfs stage
# (bake_network_defaults, build/lib/rootfs.sh) — belt and suspenders; the
# two must stay in sync. The target is rendered by cragd (netconf.zig)
# from store DNS + the dhcpcd lease exports; dhcpcd's own resolv.conf
# hook is disabled ('nohook resolv.conf' in both rendered and fallback
# configs) and iwd never touches DNS (EnableNetworkConfiguration=false).
# TARGET NOTE: /run/crag-resolv, NOT /run/crag — the API-socket dir is
# 0750 cragd:crag-api and unprivileged daemons (chronyd!) must be able
# to read the resolver config (found live: empty chronyc sources).
L+ /etc/resolv.conf - - - - ../run/crag-resolv/resolv.conf
