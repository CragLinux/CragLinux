# QEMU ARMv7 virtual board (docs/04 §1 target matrix)
#
# 32-bit ARM QEMU board: -M virt with a cortex-a15 CPU, booting U-Boot via
# -bios exactly like qemu-aarch64 (AD-009; bootz instead of booti).
# No Chimera binary repo exists for armv7 — both variants use source
# packages-mode; the first build seeds cports/packages/main/armv7.
# cbuild/apk arch is "armv7" (mapped from armv7hf by cbuild_arch_for).

[board]
name = "QEMU ARMv7"
arch = "armv7hf"

[kernel]
version = "6.12.95"
source = "upstream"
defconfig = "multi_v7_defconfig"
# Board-local fragments only; every boards/common/kernel/*.fragment
# (clang, musl, rauc, dinit, state) is merged automatically by
# build/lib/kernel.sh.
config_fragments = ["qemu.fragment"]
# No root= here: the image stage owns root=PARTLABEL=... per A/B slot
# (docs/03 §6); build/run-qemu.sh injects root= itself for direct boots.
# mac80211_hwsim.radios=3 (M3 phase 4): the AP-portal e2e needs THREE
# virtual radios - device-under-test station + AP flip on radio 0, the
# test AP on radio 1, and a "phone" client joining the provisioning AP
# on radio 2. MAC80211_HWSIM is =y (qemu.fragment), so the module
# parameter must ride the kernel cmdline (modprobe.d never applies to
# built-ins); cmdline flows board.toml -> config.py -> build-inner.sh
# KERNEL_CMDLINE -> image.sh boot.scr/grub.cfg (@CMDLINE@).
cmdline = "console=ttyAMA0,115200 rootwait mac80211_hwsim.radios=3"
# 32-bit ARM has no CONFIG_LTO_CLANG support (kernel LTO is arm64/x86-only);
# still built with the clang toolchain, just without LTO.
lto = "none"

[bootloader]
type = "u-boot"
u_boot_version = "2026.07"
# Fedora cross-gcc: clang/lld-built U-Boot hangs at self-relocation on
# qemu virt (MIGRATION-NOTES §12); revisit with a later LLVM/U-Boot.
u_boot_compiler = "gcc"
u_boot_defconfig = "qemu_arm_defconfig"

# AD-007 GPT layout sizes (docs/04 §2); defaults spelled out for clarity.
[partitions]
table = "gpt"
esp_size = "64M"
bootenv_size = "1M"
boot_size = "64M"          # per slot
rootfs_size = "512M"       # per slot; build fails if squashfs exceeds it
data_min_size = "64M"

[rauc]
compatible = "crag-qemu-armv7"
bootloader = "uboot"       # RAUC uboot backend (docs/04 §4, AD-009)

[image]
formats = ["img"]          # qcow2 is auto-added ([qemu] present)

[api]
wifi = true
ap_provisioning = true
mdns = true
lan_exposure = false       # AD-025 default

[console]
device = "ttyAMA0"
baud = 115200

[qemu]
# qemu-system-aarch64 runs 32-bit CPU models on -M virt; the container has
# no separate qemu-system-arm (run-qemu.sh falls back automatically).
machine = "virt"
cpu = "cortex-a15"
memory = "1G"
# NIC: plain boots get QEMU's default user-mode NIC; SSH forwarding is
# provided by run-qemu.sh --ssh-port=<port> (host ports are a launcher
# concern — a board TOML must not bind them)
