[variant]
name = "Development"
description = "QEMU virtual machine for testing without hardware"

[packages]
# Dev builds consume Chimera's signed binaries for unmodified base packages
# (docs/03 §1 "Binary consumption for dev builds"). Override per-invocation
# with --packages-mode=source; release/nightly variants are full-source.
mode = "binary"
install = [
    # openssh comes from the kerberos-free shadow in the cports fork
    # (main/openssh) — upstream cports openssh needs heimdal,
    # which does not cross-build (GAP §3.2).
    "openssh",
    "openssh-dinit",
    "curl",            # dev tooling: exercise cragd's API by hand (docs/06 §8)
    "opendoas",
    "nano",
    "less",
    "dhcpcd",
    "dhcpcd-dinit",    # dinit service file (auto-split subpackage)
]

[services]
enable = ["dhcpcd", "sshd"]

[users]
create = [
    { name = "dev", uid = 1000, groups = ["wheel"], shell = "/bin/sh" },
]

[kernel]
cmdline_append = "loglevel=7"
