# Crag Linux - scheduled cports update-currency report.
#
# Owning the cports fork means owning version/security currency. This job
# sweeps the port tree nightly (and on demand) and publishes the report so
# an agent or maintainer can work the list down / open re-pin PRs. It only
# READS upstream version metadata — it never re-pins anything (re-pins are
# deliberate, per cports/README.md).

name: update-report
on:
  schedule:
    - cron: "41 2 * * *"   # nightly 02:41 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: "crag | shipped | all"
        default: "shipped"

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Materialize the cports fork (pinned)
        run: |
          # TODO(release-eng): replace with a pinned hm release download;
          # until then a direct pinned clone is equivalent to the lock.
          # NOTE: the lock records an SSH url, but runners are keyless —
          # clone over https like pr.yml (the repo is public).
          if command -v hm >/dev/null; then
            hm sync --locked
          else
            PIN=$(python3 -c "import tomllib;print(tomllib.load(open('.harbormaster.lock','rb'))['entry']['cports']['resolved_sha'])" 2>/dev/null || true)
            : "${PIN:?cannot resolve cports pin from .harbormaster.lock}"
            git clone --no-checkout https://github.com/CragLinux/cports.git cports
            git -C cports checkout "$PIN"
          fi

      - name: Build crag-builder container
        run: podman build -t crag-builder -f container/Containerfile container/

      - name: cports update report
        run: ./build/crag-update-report.sh --scope "${{ github.event.inputs.scope || 'shipped' }}"

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cports-update-report
          path: build/state/update-report/
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: cat build/state/update-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
