# Harbormaster companion-repo manifest (AD-001 / AD-003 / AD-023).
#
# Declares the repositories materialized into this workspace by `hm`.
# Exact commit pins live in the committed .harbormaster.lock; use
#   hm sync --locked
# to reproduce the pinned workspace. Pin bumps are a lock-file diff in a
# normal PR (AD-023). The checkouts themselves (cports/) are gitignored.

[general]
work_dir = "./"

[git]
shallow_clone = true
clone_depth = 1

# cports is Astro's FORK of chimera-linux/cports (see cports/README.md for
# provenance + why-a-fork). Upstream declined our fixes and forbids
# AI-assisted contributions, and upstream drift risked breaking our pinned
# builds — so we own the tree. Re-pins are deliberate lock-file diffs
# (AD-023); the update-report tooling surfaces what is stale.
[[repository]]
name = "cports"
url = "git@github.com:aka-mj/cports.git"
type = "git"
branch = "astro"
path = "cports"
