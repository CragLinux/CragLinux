{
  "openapi": "3.1.0",
  "info": {
    "title": "cragd Device Configuration API",
    "description": "Local HTTP API for Crag devices (docs/06, AD-013). Documented surface: system summary, reboot/poweroff actions, this document, the update/events/operations group (docs/06 §5.3 + §4, docs/05 §5.1): RAUC-backed A/B updates modeled as operations, with an SSE event stream, the network group (docs/06 §5.2, docs/07 AD-015: iwd manages wifi only, dhcpcd owns addressing, cragd is the single policy brain), and the phase-4 provisioning group (/network/wifi/ap manual AP control, /system/factory-reset; cellular stays 501 by contract, reserved). Degradation: the update endpoints answer 503 urn:crag:problem:rauc-unavailable while the daemon has no D-Bus connection; a route whose subsystem is entirely absent from the build answers 501 (NotImplemented response component). SURFACES (AD-014): unix socket (group-gated), 127.0.0.1 (bearer token), opt-in LAN (bearer token, AD-025 default off), and — while unprovisioned in AP mode only — the AP provisioning surface, which serves an unauthenticated SUBSET: GET /api/v1/system (REDACTED — machine_id omitted), POST /api/v1/network/wifi/scan, GET /api/v1/network/wifi/networks, PUT /api/v1/network/wifi/connection; every other operation answers 403 urn:crag:problem:forbidden there (Forbidden response component). The AP surface additionally serves captive-portal furniture OUTSIDE this contract — GET / (the embedded provisioning page) and the OS probe paths /generate_204, /hotspot-detect.html, /connecttest.txt, /ncsi.txt (302 to /) — deliberately undocumented here: their shapes are dictated by phone OSes, they exist on no authenticated surface, and the router keeps them in a separate table (router.portal_routes) outside the spec↔route conformance gate, which asserts they never enter the /api/ namespace. Authored in JSON syntax (valid YAML) so the file is served verbatim at GET /api/v1/openapi.json and parsed by std.json in the route conformance test.",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "http://localhost",
      "description": "Unix socket /run/crag/cragd.sock — the default surface. Access is gated by membership in the crag-api group (filesystem permission on the socket); no bearer token is required. Example: curl --unix-socket /run/crag/cragd.sock http://localhost/api/v1/system"
    },
    {
      "url": "http://127.0.0.1:8080",
      "description": "Loopback TCP surface; every request requires the bearer token. Port 8080 rather than docs/06's :80 because cragd runs unprivileged (recorded deviation)."
    }
  ],
  "security": [{ "bearerToken": [] }],
  "paths": {
    "/api/v1/system": {
      "get": {
        "operationId": "getSystem",
        "summary": "System summary: board, variant, release, booted slot, uptime, provisioning state, health, time sync",
        "description": "On the AP provisioning surface this response is REDACTED: machine_id is omitted (it seeds the AP PSK derivation and is the factory-reset confirm token); all other SystemInfo fields are served unchanged.",
        "responses": {
          "200": {
            "description": "System information",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/SystemInfo" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v1/system/reboot": {
      "post": {
        "operationId": "rebootSystem",
        "summary": "Reboot via dinit's control-socket SHUTDOWN command",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/PowerActionRequest" }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Reboot accepted",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/PowerActionResult" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "503": { "$ref": "#/components/responses/DinitUnavailable" }
        }
      }
    },
    "/api/v1/system/poweroff": {
      "post": {
        "operationId": "poweroffSystem",
        "summary": "Power off via dinit's control-socket SHUTDOWN command",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/PowerActionRequest" }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Poweroff accepted",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/PowerActionResult" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "503": { "$ref": "#/components/responses/DinitUnavailable" }
        }
      }
    },
    "/api/v1/system/factory-reset": {
      "post": {
        "operationId": "factoryResetSystem",
        "summary": "Wipe /data and reboot (docs/07 §5); requires {\"confirm\": \"<machine-id>\"}",
        "description": "Confirm-with-serial (docs/06 §5.1): the body's confirm field must equal this device's machine_id or the request is rejected 400. On acceptance cragd dispatches the crag-factory-reset root oneshot (docs/02 §7 residual-root-ops): it flags /data/.crag/factory-reset-request, syncs, and reboots; the data-mount executor wipes /data on the way back up (fast rm -rf path; blkdiscard secure erase is a deferred per-product option), firstboot reruns, state returns to factory. Slots are untouched — the device keeps its firmware version. Authenticated surfaces only: the AP subset excludes this operation (403 there), and the redacted AP-surface GET /system withholds the confirm token by construction.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/FactoryResetRequest" }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Reset accepted; the reboot is issued after this response is on the wire (deferred-shutdown discipline).",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/PowerActionResult" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "501": { "$ref": "#/components/responses/NotImplemented" },
          "503": { "$ref": "#/components/responses/DinitUnavailable" }
        }
      }
    },
    "/api/v1/openapi.json": {
      "get": {
        "operationId": "getOpenapi",
        "summary": "This OpenAPI document, served byte-for-byte",
        "responses": {
          "200": {
            "description": "OpenAPI 3.1 document (this file)",
            "content": {
              "application/json": {
                "schema": { "type": "object" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v1/update/status": {
      "get": {
        "operationId": "getUpdateStatus",
        "summary": "RAUC slot states, booted slot, primary slot, installer operation, last install error (docs/06 §5.3)",
        "description": "Snapshot assembled from RAUC's D-Bus surface: GetSlotStatus, GetPrimary, and the BootSlot/Operation/LastError/Compatible properties. Answers while an install is running (operation != \"idle\"), so it doubles as the coarse install-state probe.",
        "responses": {
          "200": {
            "description": "Update status",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/UpdateStatus" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "502": { "$ref": "#/components/responses/RaucError" },
          "503": { "$ref": "#/components/responses/RaucUnavailable" }
        }
      }
    },
    "/api/v1/update": {
      "post": {
        "operationId": "startUpdate",
        "summary": "Install a signed RAUC bundle from a URL (JSON body) or as a staged binary upload; returns 202 + an operation to poll",
        "description": "Two request forms (docs/05 §5.1). application/json {\"url\", \"force\"}: an http(s) URL goes straight to RAUC InstallBundle (streamed verity install, no on-device staging) — the AD-021 version gate CANNOT run for URL installs (RAUC exposes no pre-install metadata for streamed sources; recorded v1 limitation — download first and POST the file to get the gate); an absolute on-device path (e.g. a kept staged upload) is inspected and gated like an upload. application/octet-stream: the raw bundle bytes are streamed to /data/.crag/staging (free-space checked, 507 when it does not fit), verified signature-first via InspectBundle, refused with 409 if the bundle version is lower than the running release (AD-021) unless force is set, then installed; a refused upload is KEPT in staging and the 409 detail names its path so {\"url\": \"<staged path>\", \"force\": true} can force it without re-uploading. Progress: poll the returned operation, or subscribe to /api/v1/events (update.progress, update.completed). Reboot is never automatic — follow with POST /api/v1/update/apply.",
        "parameters": [
          {
            "name": "force",
            "in": "query",
            "required": false,
            "schema": { "type": "boolean", "default": false },
            "description": "AD-021 downgrade-gate override for the octet-stream form, which has no JSON body to carry {\"force\": true}; accepted (OR-ed with the body field) on the JSON form too. Forced downgrades are logged and surfaced in update history."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/InstallRequest" }
            },
            "application/octet-stream": {
              "schema": {
                "type": "string",
                "format": "binary",
                "description": "Raw signed RAUC bundle bytes (.raucb, verity format — AD-010)."
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Install started; poll the operation or watch update.* events.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/OperationRef" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/UpdateConflict" },
          "502": { "$ref": "#/components/responses/RaucError" },
          "503": { "$ref": "#/components/responses/RaucUnavailable" },
          "507": { "$ref": "#/components/responses/InsufficientStorage" }
        }
      }
    },
    "/api/v1/update/apply": {
      "post": {
        "operationId": "applyUpdate",
        "summary": "Reboot into the newly primary slot (docs/05 §5.1: reboot is never automatic; this is the explicit second step)",
        "responses": {
          "202": {
            "description": "Apply accepted; the reboot is issued after this response is on the wire (same deferred discipline as the power actions).",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/PowerActionResult" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/NoPendingUpdate" },
          "502": { "$ref": "#/components/responses/RaucError" },
          "503": { "$ref": "#/components/responses/RaucUnavailable" }
        }
      }
    },
    "/api/v1/update/rollback": {
      "post": {
        "operationId": "rollbackUpdate",
        "summary": "Mark the booted slot bad, make the other slot primary, reboot (docs/05 §5.1)",
        "responses": {
          "202": {
            "description": "Rollback accepted; the reboot is issued after this response is on the wire.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/PowerActionResult" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/NoRollbackTarget" },
          "502": { "$ref": "#/components/responses/RaucError" },
          "503": { "$ref": "#/components/responses/RaucUnavailable" }
        }
      }
    },
    "/api/v1/events": {
      "get": {
        "operationId": "getEvents",
        "summary": "Server-sent events stream: typed events (update.progress, update.completed, network.wifi.state, ...) with Last-Event-ID replay from a 1024-event ring",
        "description": "Responds 200 text/event-stream and holds the connection. Frames map to the Event schema: 'id:' = Event.id (monotonic from 1, never reused), 'event:' = Event.event_type, 'data:' = Event.payload (one self-contained JSON document). A comment line (': keepalive') is written during idle periods. Replay: send Last-Event-ID to receive retained events with greater ids before live delivery (an id older than the ring's oldest resumes from the oldest retained; 0 replays the whole ring; omit the header for live-only). Backpressure (docs/06 §7): at most 16 concurrent subscribers (503 beyond the cap); a subscriber the 1024-event ring laps is NOT dropped — it receives one 'event: overflow' marker frame and delivery resumes from the oldest retained event (the marker announces the gap).",
        "parameters": [
          {
            "name": "Last-Event-ID",
            "in": "header",
            "required": false,
            "schema": { "type": "string" },
            "description": "Standard SSE resume header: the last event id already seen (0 requests a full replay of the retained ring)."
          }
        ],
        "responses": {
          "200": {
            "description": "SSE stream; frame fields are documented by the Event schema.",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string",
                  "description": "SSE wire format: 'id: <n>\\nevent: <type>\\ndata: <json>\\n\\n' frames, ': keepalive' comments while idle, an 'event: overflow' marker when the ring lapped this subscriber (delivery then resumes from the oldest retained event)."
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "503": { "$ref": "#/components/responses/EventStreamSaturated" }
        }
      }
    },
    "/api/v1/operations": {
      "get": {
        "operationId": "listOperations",
        "summary": "All operations known to this daemon run, newest first (docs/06 §4 async model)",
        "description": "The registry is in-memory and bounded (oldest finished operations evicted first); it does not survive a daemon restart — see the Operation schema for the restart re-attach contract.",
        "responses": {
          "200": {
            "description": "Operations, newest first.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": { "$ref": "#/components/schemas/Operation" }
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v1/operations/{id}": {
      "get": {
        "operationId": "getOperation",
        "summary": "One operation by id (op-<n>): state, progress, error",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": { "type": "string" }
          }
        ],
        "responses": {
          "200": {
            "description": "Operation snapshot.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Operation" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/v1/network": {
      "get": {
        "operationId": "getNetwork",
        "summary": "All interfaces: type, MAC, carrier/rssi, addresses, WAN role (docs/06 §5.2)",
        "description": "M3 phase-3 group. Observed state comes from read-only rtnetlink (links/addresses/carrier) plus iwd for wifi; desired state from the store. Answers 501 not-implemented until the phase-3 fill stage wires the backends.",
        "responses": {
          "200": {
            "description": "Interface list with WAN roles.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/NetworkStatus" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      }
    },
    "/api/v1/network/ethernet/{iface}": {
      "parameters": [
        { "name": "iface", "in": "path", "required": true, "schema": { "type": "string" }, "description": "Kernel interface name, e.g. eth0" }
      ],
      "get": {
        "operationId": "getEthernet",
        "summary": "Desired wired config for one interface (DHCP defaults when never configured)",
        "responses": {
          "200": { "description": "Ethernet config.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/EthernetConfig" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      },
      "put": {
        "operationId": "putEthernet",
        "summary": "Replace the wired config; persists to the store, re-renders dhcpcd.conf, reloads dhcpcd",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/EthernetConfig" } } } },
        "responses": {
          "200": { "description": "Applied config.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/EthernetConfig" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      },
      "patch": {
        "operationId": "patchEthernet",
        "summary": "JSON Merge Patch (RFC 7396) of the wired config: null deletes/resets a member, objects merge recursively, arrays replace wholesale",
        "requestBody": { "required": true, "content": { "application/merge-patch+json": { "schema": { "type": "object", "description": "RFC 7396 merge patch against EthernetConfig" } } } },
        "responses": {
          "200": { "description": "Merged config.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/EthernetConfig" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      }
    },
    "/api/v1/network/wifi": {
      "get": {
        "operationId": "getWifi",
        "summary": "Radio state, current connection (ssid, rssi, freq), station/ap mode",
        "responses": {
          "200": { "description": "Wifi state.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WifiState" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      }
    },
    "/api/v1/network/wifi/scan": {
      "post": {
        "operationId": "scanWifi",
        "summary": "Trigger an iwd station scan; 202 + operation (kind wifi_scan), results at GET /api/v1/network/wifi/networks",
        "responses": {
          "202": { "description": "Scan started.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OperationRef" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      }
    },
    "/api/v1/network/wifi/networks": {
      "get": {
        "operationId": "listWifiNetworks",
        "summary": "Latest scan results (ssid, signal, security); cached pre-AP results while in AP mode",
        "responses": {
          "200": { "description": "Visible networks.", "content": { "application/json": { "schema": { "type": "array", "items": { "$ref": "#/components/schemas/WifiNetwork" } } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      }
    },
    "/api/v1/network/wifi/connection": {
      "get": {
        "operationId": "getWifiConnection",
        "summary": "The single (v1) configured station profile; psk is write-only and redacted in responses",
        "responses": {
          "200": { "description": "Configured profile, or JSON null when none is configured.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WifiConnectionState" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      },
      "put": {
        "operationId": "putWifiConnection",
        "summary": "Persist {ssid, psk} (rendered as an iwd known-network PSK file) and connect; a valid-but-unsatisfiable config is NOT an error (docs/06 §7)",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WifiConnectionRequest" } } } },
        "responses": {
          "202": { "description": "Persisted; connection attempt underway (watch network.wifi.state events, or poll GET /api/v1/network/wifi).", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WifiConnectAccepted" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      },
      "delete": {
        "operationId": "deleteWifiConnection",
        "summary": "Forget the profile: iwd KnownNetwork.Forget, PSK file removed, store field nulled",
        "responses": {
          "204": { "description": "Profile forgotten." },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      }
    },
    "/api/v1/network/wifi/ap": {
      "get": {
        "operationId": "getWifiAp",
        "summary": "AP/provisioning mode state: enabled, ssid, subnet",
        "description": "Normally driven by the provisioning state machine (docs/07 §4): SSID crag-<last 6 hex of machine-id>, WPA2 PSK derived per-device (printed on the label), subnet 192.168.223.0/24 served by iwd's built-in DHCP from the rendered AP profile.",
        "responses": {
          "200": { "description": "AP state.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WifiApState" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      },
      "put": {
        "operationId": "putWifiAp",
        "summary": "Manual AP enable/disable for on-demand-AP products",
        "description": "Persists system.ap.enabled_override in the store: true forces the AP up, false forces it down even while unprovisioned, absent/null returns control to the provisioning state machine. AUTHENTICATED SURFACES ONLY — the AP unauthenticated subset excludes this operation (403): a portal client must never be able to hold the AP open or kill the surface it stands on.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WifiApConfig" } } } },
        "responses": {
          "200": { "description": "Applied AP config.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WifiApState" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      }
    },
    "/api/v1/services": {
      "get": {
        "operationId": "getServices",
        "summary": "App-controllable services: name, state, pid, restart count (docs/06 §5.4)",
        "description": "DELIBERATELY NARROW (docs/06 §5.4, docs/08 §5): lists ONLY the app services whose external-tree manifest set [integration].api_controllable = true; platform/system services are never listed. cragd learns the controllable set by reading the usr/lib/crag/services/*.json manifest sidecars at startup. There is no arbitrary dinitctl passthrough — the API must not become a privilege-escalation bridge to init. 501 while the services subsystem is unwired in the running build.",
        "responses": {
          "200": { "description": "App-controllable service list.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ServiceList" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" },
          "503": { "$ref": "#/components/responses/DinitUnavailable" }
        }
      }
    },
    "/api/v1/services/{name}/restart": {
      "post": {
        "operationId": "restartService",
        "summary": "Restart an app-controllable service (docs/06 §5.4)",
        "description": "Allowed ONLY for a service whose manifest set api_controllable = true (docs/08 §5). A name that is not api_controllable — or does not exist — answers 404, NOT 403: revealing that a service exists is itself information the narrow surface withholds. Restart goes through dinit's control socket (AD-016, no shelling out). 501 while the services subsystem is unwired.",
        "parameters": [ { "name": "name", "in": "path", "required": true, "schema": { "type": "string" } } ],
        "responses": {
          "202": { "description": "Restart initiated (dinit settles it asynchronously).", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ServiceActionResult" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "501": { "$ref": "#/components/responses/NotImplemented" },
          "503": { "$ref": "#/components/responses/DinitUnavailable" }
        }
      }
    },
    "/api/v1/services/{name}/stop": {
      "post": {
        "operationId": "stopService",
        "summary": "Stop an app-controllable service (docs/06 §5.4)",
        "description": "Allowed ONLY for a service whose manifest set api_controllable = true (docs/08 §5); a non-controllable or unknown name answers 404, not 403. Gentle stop over dinit's control socket. 501 while the services subsystem is unwired.",
        "parameters": [ { "name": "name", "in": "path", "required": true, "schema": { "type": "string" } } ],
        "responses": {
          "202": { "description": "Stop initiated.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ServiceActionResult" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "501": { "$ref": "#/components/responses/NotImplemented" },
          "503": { "$ref": "#/components/responses/DinitUnavailable" }
        }
      }
    },
    "/api/v1/services/{name}/start": {
      "post": {
        "operationId": "startService",
        "summary": "Start an app-controllable service (docs/06 §5.4)",
        "description": "Allowed ONLY for a service whose manifest set api_controllable = true (docs/08 §5); a non-controllable or unknown name answers 404, not 403. Start over dinit's control socket. 501 while the services subsystem is unwired.",
        "parameters": [ { "name": "name", "in": "path", "required": true, "schema": { "type": "string" } } ],
        "responses": {
          "202": { "description": "Start initiated.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ServiceActionResult" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "501": { "$ref": "#/components/responses/NotImplemented" },
          "503": { "$ref": "#/components/responses/DinitUnavailable" }
        }
      }
    },
    "/api/v1/network/wan": {
      "get": {
        "operationId": "getWan",
        "summary": "WAN policy: ordered interface preference (default [\"ethernet\", \"wifi\"])",
        "responses": {
          "200": { "description": "WAN policy.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WanPolicy" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      },
      "put": {
        "operationId": "putWan",
        "summary": "Replace the WAN order; applied as per-interface metric values in the rendered dhcpcd.conf (no route surgery)",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WanPolicy" } } } },
        "responses": {
          "200": { "description": "Applied policy.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WanPolicy" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      }
    },
    "/api/v1/network/cellular": {
      "get": {
        "operationId": "getCellular",
        "summary": "RESERVED (501 by contract): cellular lands as ModemManager beside iwd (docs/07 §1)",
        "description": "Reserved namespace per docs/06 §5.2. Always answers 501 urn:crag:problem:not-implemented with the roadmap in the detail; the path is pinned so future activation is not a breaking change.",
        "responses": {
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      },
      "put": {
        "operationId": "putCellular",
        "summary": "RESERVED (501 by contract)",
        "responses": {
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerToken": {
        "type": "http",
        "scheme": "bearer",
        "description": "Token generated at firstboot into /data/config/api-token (0640, group crag-api). Required on the 127.0.0.1 TCP surface; a missing token file fails closed (401). Requests over the unix socket /run/crag/cragd.sock are pre-authorized by crag-api group membership at connect() time and need no token (AD-014)."
      }
    },
    "responses": {
      "Unauthorized": {
        "description": "Missing or invalid bearer token. Enforced on the TCP surface only; unix-socket peers are authorized by group membership.",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      },
      "Forbidden": {
        "description": "The surface refuses this operation (problem type urn:crag:problem:forbidden). Today this is the AP provisioning surface, which serves only the unauthenticated subset (AD-014, docs/06 §6) — every other operation, known or unknown, answers 403 there. Distinct from 401: credentials would not help.",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      },
      "BadRequest": {
        "description": "Malformed request. Problem types: urn:crag:problem:bad-request — invalid JSON or unknown fields (AD-013 rejects them to surface client typos); urn:crag:problem:invalid-bundle — the uploaded/named bundle failed RAUC's signature-first InspectBundle verification.",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      },
      "NotFound": {
        "description": "No such resource (problem type urn:crag:problem:not-found). For operations: the registry is in-memory, so ids from before a daemon restart no longer resolve (the Operation schema documents the re-attach contract).",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      },
      "UpdateConflict": {
        "description": "Install refused. Problem types: urn:crag:problem:update-downgrade-refused — the bundle's version is lower than the running release (or unknown) and the request did not carry force (AD-021 monotonic-version gate; the refusal is recorded in update history, and for uploads the detail names the kept staged path for the force flow); urn:crag:problem:update-in-progress — an install operation is already running (RAUC is single-flight).",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      },
      "NoPendingUpdate": {
        "description": "Apply refused. Problem types: urn:crag:problem:no-pending-update — no slot is pending activation, the primary slot is the booted slot (docs/06 §5.3: no-op error when none pending); urn:crag:problem:update-in-progress — RAUC is not idle yet, wait for the install operation to finish.",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      },
      "NoRollbackTarget": {
        "description": "Rollback refused. Problem types: urn:crag:problem:no-rollback-target — the other slot has never held a release, so there is nothing to roll back to (docs/05 §5.1); urn:crag:problem:update-in-progress — RAUC is not idle yet.",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      },
      "InsufficientStorage": {
        "description": "Bundle upload exceeds the free space available for staging under /data/.crag/staging plus a safety margin (problem type urn:crag:problem:insufficient-storage). The URL install form needs no staging and is unaffected.",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      },
      "RaucUnavailable": {
        "description": "A required update backend is unreachable: urn:crag:problem:rauc-unavailable when the RAUC D-Bus connection is down (or was never established), urn:crag:problem:dinit-unavailable when an apply/rollback's reboot step cannot reach the dinit control socket. The daemon itself is healthy — retryable.",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      },
      "RaucError": {
        "description": "RAUC rejected or garbled a D-Bus call (problem type urn:crag:problem:rauc-error): the transport is up but the backend answered with an error — the detail carries the D-Bus error name. 502 because cragd is a healthy gateway to an unhealthy backend.",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      },
      "EventStreamSaturated": {
        "description": "SSE subscriber cap reached (16 concurrent — docs/06 §7 backpressure; problem type urn:crag:problem:overloaded). Retry after another subscriber disconnects.",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      },
      "DinitUnavailable": {
        "description": "The dinit control socket could not be reached (problem type urn:crag:problem:dinit-unavailable). The daemon is healthy; the power-action mechanism is not — retryable.",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      },
      "NotImplemented": {
        "description": "Reserved-endpoint response (problem type urn:crag:problem:not-implemented): used by namespaces documented as reserved (docs/06 §5.2 cellular) and by any routed endpoint whose subsystem is not yet wired in the running build.",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      }
    },
    "schemas": {
      "SystemInfo": {
        "type": "object",
        "description": "Response of GET /api/v1/system; mirrors system.SystemInfo in the daemon (field parity enforced by the conformance test).",
        "properties": {
          "board": { "type": "string", "description": "Board identity, e.g. qemu-aarch64 (placeholder until crag-release parsing lands)" },
          "variant": { "type": "string", "description": "Image variant, e.g. dev or prod" },
          "release": { "type": "string", "description": "Crag release version" },
          "booted_slot": { "type": ["string", "null"], "description": "RAUC slot currently booted, from rauc.slot= on the kernel cmdline; null on a direct kernel boot (dev QEMU) with no RAUC-managed slot" },
          "machine_id": { "type": "string", "description": "Stable per-device identity from /etc/machine-id" },
          "uptime_s": { "type": "integer", "minimum": 0, "description": "Whole seconds since boot (/proc/uptime, CLOCK_BOOTTIME-derived so suspended time counts)" },
          "provisioning": { "type": "string", "description": "Provisioning state machine summary (docs/07 §4): factory | provisioning | provisioned" },
          "health": { "type": "string", "description": "Reconciler health summary" },
          "time_synced": { "type": "boolean", "description": "Kernel NTP discipline state (docs/07 §6): adjtimex STA_UNSYNC is clear — chronyd has stepped/slewed the clock. Product apps should gate their own TLS-dependent operations on this; cragd gates its https update installs on it (or the clock being past the build-time floor). Deliberately FLAT rather than docs/07 §6's time{synced, floor} object sketch (recorded deviation): SystemInfo mirrors the daemon struct field-for-field under the conformance parity gate, and the floor context (build-epoch, applied by root firstboot and re-checked — capless, gate-only — at every cragd startup) is an on-device operator concern served by `cragctl time` (synced/floor/now/floor_ok) instead of a remote API field" },
          "last_error": { "type": ["string", "null"], "description": "Last provisioning-AP failure (docs/07 §4 item 5): 'ap-start-failed' | 'ap-stop-failed', null when the last AP cycle was clean. Kept in the REDACTED AP-surface view too — the embedded portal page displays it and re-offers the credentials form (the survivable wrong-password loop)" }
        },
        "required": ["board", "variant", "release", "booted_slot", "machine_id", "uptime_s", "provisioning", "health", "time_synced", "last_error"]
      },
      "PowerActionRequest": {
        "type": "object",
        "description": "Optional body for reboot/poweroff. Phase 1 accepts and ignores it; delay is honored once the dinit client lands.",
        "properties": {
          "delay": { "type": "integer", "minimum": 0, "description": "Seconds to wait before executing; absent or 0 means immediately" }
        },
        "additionalProperties": false
      },
      "PowerActionResult": {
        "type": "object",
        "description": "202 body for accepted actions that end in a reboot/poweroff (power actions, update apply/rollback). These are deferred-shutdown actions, not tracked operations, so operation is null.",
        "properties": {
          "operation": {
            "type": ["string", "null"],
            "description": "Operation resource URL for progress tracking (docs/06 §4); null for plain deferred-shutdown actions"
          }
        },
        "required": ["operation"]
      },
      "UpdateStatus": {
        "type": "object",
        "description": "Response of GET /api/v1/update/status: rauc.Status (assembled from RAUC's GetSlotStatus, GetPrimary, and the BootSlot/Operation/LastError/Compatible properties) plus the daemon's AD-021 context — running release, pending flag, in-flight operation, and install history.",
        "properties": {
          "boot_slot": { "type": "string", "description": "Bootname of the booted slot (RAUC BootSlot property), e.g. \"A\"" },
          "primary": { "type": ["string", "null"], "description": "Slot the bootloader tries first (GetPrimary); differs from the booted slot exactly when an installed update is pending apply. Null when the bootloader reports none." },
          "operation": { "type": "string", "description": "Installer state: \"idle\", or \"installing\" while an install is in flight (non-idle right after daemon start triggers the docs/06 §7 re-attach)" },
          "last_error": { "type": "string", "description": "RAUC LastError property; empty when the last install succeeded" },
          "compatible": { "type": "string", "description": "This device's RAUC compatible string (docs/05 §6), e.g. \"crag-virt\"; bundles must match" },
          "running_release": { "type": "string", "description": "The booted image's release version (os-release CRAG_RELEASE) — the value the AD-021 monotonic-version gate compares candidate bundles against" },
          "pending": { "type": "boolean", "description": "True when the primary slot is not the booted slot: an installed update awaits POST /api/v1/update/apply" },
          "current_operation": { "type": ["string", "null"], "description": "Id (\"op-<n>\") of the in-flight install operation; null when none" },
          "slots": {
            "type": "array",
            "items": { "$ref": "#/components/schemas/SlotStatus" },
            "description": "One entry per RAUC slot (boot and rootfs slots)"
          },
          "history": {
            "type": "array",
            "items": { "$ref": "#/components/schemas/UpdateHistoryEntry" },
            "description": "Install requests this daemon run handled, newest first, bounded (16); AD-021 refusals and forced installs are surfaced here"
          }
        },
        "required": ["boot_slot", "primary", "operation", "last_error", "compatible", "running_release", "pending", "current_operation", "slots", "history"]
      },
      "UpdateHistoryEntry": {
        "type": "object",
        "description": "One install request in UpdateStatus.history (volatile, per daemon run).",
        "properties": {
          "operation": { "type": "string", "description": "Operation id (\"op-<n>\"); empty for refused requests — no operation was created" },
          "version": { "type": "string", "description": "Bundle version from InspectBundle; empty when unknown (URL installs)" },
          "source": { "type": "string", "enum": ["url", "upload", "path", "reattach"], "description": "How the bundle reached the daemon (reattach = restart re-attach to an in-flight RAUC install, docs/06 §7)" },
          "forced": { "type": "boolean", "description": "AD-021: true when the request carried force and the downgrade gate was bypassed" },
          "outcome": { "type": "string", "enum": ["installing", "succeeded", "failed", "refused"], "description": "Terminal state, or \"installing\" while in flight" }
        },
        "required": ["operation", "version", "source", "forced", "outcome"]
      },
      "SlotStatus": {
        "type": "object",
        "description": "One slot from RAUC GetSlotStatus, flattened to the fields the daemon serves; mirrors rauc.SlotStatus.",
        "properties": {
          "name": { "type": "string", "description": "Slot name, e.g. \"rootfs.0\"" },
          "state": { "type": "string", "description": "\"booted\" | \"inactive\" | \"active\" (empty when RAUC omits the key)" },
          "bundle_version": { "type": "string", "description": "Version of the bundle installed in the slot; empty when the slot was never written" },
          "boot_status": { "type": "string", "description": "\"good\" | \"bad\" (bootloader-backed via the statusfile); empty when unknown" },
          "boot_attempts_left": { "type": ["integer", "null"], "description": "Remaining bootloader boot attempts where the bootloader exposes them; null otherwise" },
          "device": { "type": "string", "description": "Backing block device, e.g. \"/dev/disk/by-partlabel/rootfs.A\"" }
        },
        "required": ["name", "state", "bundle_version", "boot_status", "boot_attempts_left", "device"]
      },
      "InstallRequest": {
        "type": "object",
        "description": "JSON form of POST /api/v1/update: install from an http(s) URL (any server with Range support; RAUC streams verity bundles without on-device staging — docs/05 §3, AD-021 gate cannot run) or from an absolute on-device path (inspected + gated; this is also the force flow for a kept staged upload).",
        "properties": {
          "url": { "type": "string", "format": "uri", "description": "http(s) bundle URL handed to RAUC InstallBundle, or an absolute on-device bundle path (e.g. \"/data/.crag/staging/upload-1.raucb\")" },
          "force": { "type": "boolean", "default": false, "description": "AD-021 override: allow installing a version lower than the running release (logged and surfaced in update history)" }
        },
        "required": ["url"],
        "additionalProperties": false
      },
      "OperationRef": {
        "type": "object",
        "description": "202 body for accepted long-running work (AD-013 async model).",
        "properties": {
          "operation": { "type": "string", "description": "Operation resource path, e.g. \"/api/v1/operations/op-1\" — poll it, or match its id in update.* event payloads" }
        },
        "required": ["operation"]
      },
      "Operation": {
        "type": "object",
        "description": "One unit of long-running work (docs/06 §4); mirrors ops.Operation in the daemon. Ids are \"op-<n>\", monotonic per daemon run. The registry is volatile: after a daemon restart an in-flight RAUC install is re-attached under a NEW operation id (docs/06 §7), and pre-restart ids answer 404.",
        "properties": {
          "id": { "type": "string", "description": "\"op-<n>\"" },
          "kind": { "type": "string", "enum": ["update_install", "wifi_scan"], "description": "What the operation does (wifi_scan lands with M3 phase 3)" },
          "state": { "type": "string", "enum": ["pending", "running", "succeeded", "failed"] },
          "progress": { "type": "integer", "minimum": 0, "maximum": 100, "description": "Percent complete; meaningful while running (RAUC progress percentage)" },
          "message": { "type": "string", "description": "Human-readable current step, e.g. \"Copying image\"" },
          "error": { "type": ["string", "null"], "description": "Failure detail when state is \"failed\"; null otherwise" },
          "result": { "type": ["string", "null"], "description": "Outcome summary when state is \"succeeded\" (docs/06 §4 state/progress/error/result), e.g. the install's next step; null otherwise" }
        },
        "required": ["id", "kind", "state", "progress", "message", "error", "result"]
      },
      "Event": {
        "type": "object",
        "description": "Documents the SSE frames of GET /api/v1/events (the stream itself is text/event-stream, not JSON): id maps to the frame's 'id:' field, event_type to 'event:', payload to 'data:'. Mirrors events.Event in the daemon.",
        "properties": {
          "id": { "type": "integer", "minimum": 1, "description": "Monotonic, 1-based, never reused; usable as Last-Event-ID to resume the stream" },
          "event_type": { "type": "string", "description": "Dotted type, e.g. \"update.progress\", \"update.completed\", \"network.wifi.state\", \"system.provisioned\"" },
          "payload": { "type": "string", "description": "One self-contained JSON document; update.* payloads carry the operation id when applicable" }
        },
        "required": ["id", "event_type", "payload"]
      },
      "NetworkStatus": {
        "type": "object",
        "description": "Response of GET /api/v1/network (docs/06 §5.2): the network overview — one NetworkInterface per observed link (read-only rtnetlink dump: name/MAC/up/carrier/addresses; iwd contributes rssi for wifi) plus the effective WAN policy from the store (network.wan.order).",
        "properties": {
          "interfaces": {
            "type": "array",
            "items": { "$ref": "#/components/schemas/NetworkInterface" },
            "description": "Every kernel network interface except loopback, in ifindex order."
          },
          "wan": { "$ref": "#/components/schemas/WanPolicy" }
        },
        "required": ["interfaces", "wan"]
      },
      "NetworkInterface": {
        "type": "object",
        "description": "One observed interface in the GET /api/v1/network overview. Observed state only (rtnetlink + iwd) — desired config lives at /network/ethernet/{iface} and /network/wifi/connection.",
        "properties": {
          "name": { "type": "string", "description": "Kernel interface name, e.g. \"eth0\", \"wlan0\"" },
          "type": { "type": "string", "enum": ["ethernet", "wifi"], "description": "Interface class as used by the WAN order (wl* names classify as wifi)" },
          "mac": { "type": ["string", "null"], "description": "Colon-hex hardware address; null when the link reports none" },
          "up": { "type": "boolean", "description": "Administrative state (IFF_UP)" },
          "carrier": { "type": "boolean", "description": "Physical link/carrier state (IFF_LOWER_UP); for wifi, association implies carrier" },
          "addresses": { "type": "array", "items": { "type": "string" }, "description": "Assigned addresses in \"address/prefix\" notation, IPv4 and IPv6, in kernel order; empty when unconfigured" },
          "rssi_dbm": { "type": ["integer", "null"], "description": "Wifi only: current signal strength from iwd; null for ethernet or while disconnected" },
          "wan_role": { "type": ["string", "null"], "description": "This interface class's position in network.wan.order (\"primary\", \"backup\"); null when the class is not in the order" }
        },
        "required": ["name", "type", "up", "carrier", "addresses"]
      },
      "EthernetConfig": {
        "type": "object",
        "description": "Desired wired config (docs/06 §5.2); mirrors the store's network.ethernet.<iface> object (schema 1, all fields defaulted — an interface never configured GETs as all-defaults DHCP). PUT is a full replace: omitted members reset to their defaults. Also the JSON Merge Patch target of PATCH (RFC 7396: null deletes/resets a member, arrays replace wholesale). Unknown members are rejected 400 (AD-013). ipv6 fields are reserved for a later phase.",
        "properties": {
          "ipv4": {
            "type": "object",
            "properties": {
              "mode": { "type": "string", "enum": ["dhcp", "static"], "default": "dhcp" },
              "address": { "type": ["string", "null"], "description": "Dotted-quad local address; required (non-null) when mode=static, null otherwise" },
              "prefix": { "type": ["integer", "null"], "minimum": 0, "maximum": 32, "description": "CIDR prefix length for address; mode=static only" },
              "gateway": { "type": ["string", "null"], "description": "Default router; optional even for mode=static (a gateway-less static subnet is valid)" }
            },
            "additionalProperties": false
          },
          "dns": { "type": "array", "items": { "type": "string" }, "description": "Static resolvers; win over DHCP-learned DNS in the rendered resolv.conf (default: empty)" }
        },
        "additionalProperties": false
      },
      "WifiState": {
        "type": "object",
        "description": "Response of GET /api/v1/network/wifi: radio presence/power, station|ap|off mode, current connection — assembled live from iwd's ObjectManager tree (wifi.State in the daemon). A board without a radio (or with iwd down) answers radio_present=false, state \"unavailable\" — not an HTTP error. Frequency is not exposed in v1 (iwd's Station interface does not carry it; recorded deviation from docs/06 §5.2's \"freq\", additive later via diagnostics).",
        "properties": {
          "radio_present": { "type": "boolean", "description": "An iwd Device object exists on the bus" },
          "powered": { "type": "boolean", "description": "Radio powered (iwd Device.Powered)" },
          "mode": { "type": "string", "enum": ["station", "ap", "off"], "description": "iwd Device.Mode" },
          "state": { "type": "string", "description": "iwd Station.State (\"connected\", \"connecting\", \"disconnected\", \"roaming\", ...); \"unavailable\" without a radio/station" },
          "connected_ssid": { "type": ["string", "null"], "description": "SSID of the connected network; null while not connected" },
          "rssi_dbm": { "type": ["integer", "null"], "description": "Current signal strength; null while not connected" }
        },
        "required": ["radio_present", "powered", "mode", "state", "connected_ssid", "rssi_dbm"]
      },
      "WifiNetwork": {
        "type": "object",
        "description": "One scan result of GET /api/v1/network/wifi/networks (iwd GetOrderedNetworks, strongest first; iwd's 0.01-dBm units already converted to whole dBm).",
        "properties": {
          "ssid": { "type": "string" },
          "signal_dbm": { "type": "integer", "description": "Signal strength in dBm (negative; closer to 0 is stronger)" },
          "security": { "type": "string", "enum": ["open", "psk", "8021x"], "description": "psk covers WPA2/WPA3-PSK; 8021x networks are visible but not connectable in v1 (EAP reserved)" },
          "known": { "type": "boolean", "description": "A stored profile exists for this SSID" },
          "connected": { "type": "boolean", "description": "This is the currently connected network" }
        },
        "required": ["ssid", "signal_dbm", "security", "known", "connected"]
      },
      "WifiConnectionRequest": {
        "type": "object",
        "description": "PUT /api/v1/network/wifi/connection body: the single (v1) station profile {ssid, psk}. Persisted to the store, rendered as an iwd known-network <ssid>.psk file, then connected. WPA2/WPA3-PSK only in v1; EAP fields reserved (docs/06 §5.2). Unknown members are rejected 400 (AD-013).",
        "properties": {
          "ssid": { "type": "string", "minLength": 1, "maxLength": 32 },
          "psk": { "type": "string", "minLength": 8, "maxLength": 63, "description": "WPA-PSK passphrase (8..63 chars); WRITE-ONLY — accepted here, never returned by any endpoint" }
        },
        "required": ["ssid", "psk"],
        "additionalProperties": false
      },
      "WifiConnectionState": {
        "type": ["object", "null"],
        "description": "GET /api/v1/network/wifi/connection response: the configured station profile, or JSON null when none is configured. The psk is redacted (write-only, see WifiConnectionRequest) — restoring it is the store's job, not a client round-trip's.",
        "properties": {
          "ssid": { "type": "string" }
        }
      },
      "WifiConnectAccepted": {
        "type": "object",
        "description": "202 body of PUT /api/v1/network/wifi/connection: the profile is persisted and the connection attempt is underway. Progress is narrated by network.wifi.state events and observable at GET /api/v1/network/wifi; when the daemon additionally tracks the attempt as an operation its resource path is given, else null. A valid-but-unsatisfiable profile (SSID out of range) is NOT an error (docs/06 §7): the 202 stands and the state shows degraded.",
        "properties": {
          "operation": { "type": ["string", "null"], "description": "Operation resource path when the connect is operation-tracked; null when events/state polling is the only progress surface" }
        },
        "required": ["operation"]
      },
      "WifiApState": {
        "type": "object",
        "description": "GET /api/v1/network/wifi/ap response (docs/06 §5.2, docs/07 §4): the provisioning AP's state. The PSK is never returned by any HTTP endpoint — the label-printing story goes through a socket-surface-only cragctl flow (phase-4 fill).",
        "properties": {
          "enabled": { "type": "boolean", "description": "AP mode is currently up" },
          "ssid": { "type": "string", "description": "crag-<last 6 hex of machine-id> (identical to the mDNS instance label)" },
          "subnet": { "type": "string", "description": "The AP provisioning subnet, 192.168.223.0/24 (cragd at .1; iwd's built-in DHCP serves the pool)" }
        },
        "required": ["enabled", "ssid", "subnet"]
      },
      "WifiApConfig": {
        "type": "object",
        "description": "PUT /api/v1/network/wifi/ap body: manual AP control for on-demand-AP products. Persisted as system.ap.enabled_override; null returns control to the provisioning state machine. Unknown members rejected 400 (AD-013).",
        "properties": {
          "enabled": { "type": ["boolean", "null"], "description": "true = force AP up, false = force AP down, null = provisioning state machine decides (the default)" }
        },
        "required": ["enabled"],
        "additionalProperties": false
      },
      "FactoryResetRequest": {
        "type": "object",
        "description": "POST /api/v1/system/factory-reset body (docs/06 §5.1 confirm-with-serial).",
        "properties": {
          "confirm": { "type": "string", "description": "Must equal this device's machine_id (GET /api/v1/system on an authenticated surface) or the request is rejected 400" }
        },
        "required": ["confirm"],
        "additionalProperties": false
      },
      "WanPolicy": {
        "type": "object",
        "description": "WAN policy (docs/06 §5.2): ordered interface-class preference, applied as per-interface metric values in the rendered dhcpcd.conf (never rtnetlink route surgery). Also the PUT body — a full replace; unknown members rejected 400 (AD-013).",
        "properties": {
          "order": { "type": "array", "items": { "type": "string" }, "minItems": 1, "description": "Interface classes, most preferred first; \"ethernet\" and \"wifi\" today (\"cellular\" joins when the reserved namespace activates). Default [\"ethernet\", \"wifi\"]; first class with connectivity wins the default route" }
        },
        "required": ["order"],
        "additionalProperties": false
      },
      "ServiceStatus": {
        "type": "object",
        "description": "One app-controllable service (docs/06 §5.4): name, dinit state, pid (null when not running), and restart count. Reported only for services whose manifest set api_controllable = true.",
        "properties": {
          "name": { "type": "string", "description": "The dinit service name (matches the manifest [service].name)" },
          "state": { "type": "string", "enum": ["stopped", "starting", "started", "stopping", "unknown"], "description": "dinit service state (service-constants.h service_state_t). \"unknown\" means the service could not be queried on the control socket (e.g. momentarily unloaded) — the service is still listed because it is api_controllable per its manifest." },
          "pid": { "type": ["integer", "null"], "description": "Process id while a live process exists; null otherwise (stopped/starting, or a service that runs no long-lived process)" },
          "restart_count": { "type": "integer", "description": "Number of API-initiated restarts (POST .../restart) this daemon run. dinit's control protocol exposes no automatic-restart counter in any status buffer, so this counts only restarts requested through this API; it resets when cragd restarts." }
        },
        "required": ["name", "state", "pid", "restart_count"]
      },
      "ServiceList": {
        "type": "array",
        "description": "GET /api/v1/services response: every api_controllable service (docs/06 §5.4). Empty when no app opted in.",
        "items": { "$ref": "#/components/schemas/ServiceStatus" }
      },
      "ServiceActionResult": {
        "type": "object",
        "description": "202 body of POST /api/v1/services/{name}/{restart,stop,start}: the action was accepted; dinit settles it asynchronously (observe the next GET /api/v1/services). operation is null today (service actions are not operation-tracked) — the field is present for forward-compatibility with the operations model (docs/06 §4).",
        "properties": {
          "operation": { "type": ["string", "null"], "description": "Operation resource path when the action is operation-tracked; null otherwise" }
        },
        "required": ["operation"]
      },
      "Problem": {
        "type": "object",
        "description": "RFC 7807 problem details (AD-013). type is a stable URN per error class, e.g. urn:crag:problem:not-found.",
        "properties": {
          "type": { "type": "string" },
          "title": { "type": "string" },
          "status": { "type": "integer" },
          "detail": { "type": "string" }
        },
        "required": ["type", "title", "status"]
      }
    }
  }
}
