# Raspberry Pi (3/4) Device Configuration

DEVICE_NAME="Raspberry Pi"
DEVICE_ARCH=aarch64

# Boot configuration
BOOTLOADER=u-boot
BOOT_PARTITION_SIZE=256M
ROOT_PARTITION_SIZE=4G

# Kernel
KERNEL_PACKAGE=linux-rpi
KERNEL_CMDLINE="console=ttyAMA0,115200 console=tty1 root=/dev/mmcblk0p2 rootwait rw"

# DTB
DTB_FILE=broadcom/bcm2711-rpi-4-b.dtb

# Additional packages
DEVICE_PACKAGES="
    base-bootstrap
    base-rpi
    dinit
    dinit-chimera
    firmware-rpi
"
