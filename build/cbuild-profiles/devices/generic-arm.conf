# Generic ARM Device Configuration

DEVICE_NAME="Generic ARM"
DEVICE_ARCH=armv7hf

# Boot configuration
BOOTLOADER=u-boot
BOOT_PARTITION_SIZE=256M
ROOT_PARTITION_SIZE=2G

# Kernel
KERNEL_PACKAGE=linux-lts
KERNEL_CMDLINE="console=ttyS0,115200 root=/dev/mmcblk0p2 rootwait rw"

# DTB (leave empty for generic)
DTB_FILE=

# Additional packages
DEVICE_PACKAGES="
    base-bootstrap
    dinit
    dinit-chimera
"
