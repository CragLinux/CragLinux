# ARMv7 Hard-Float Profile for Cross-Compilation
# Uses pre-built LLVM/Clang toolchain
#
# NOTE (migration): paths assume the astro-builder container mount at
# /workspace (= repo root); build outputs now live under build/state/.
# TODO(migration): per AD-002 this profile should be regenerated to point
# at the cbuild bldroot toolchain instead of the prebuilt LLVM toolchain.

ARCH=armv7hf
TARGET_TRIPLE=armv7-unknown-linux-musleabihf

# Paths
TOOLCHAIN_DIR=/workspace/toolchain
BUILD_DIR=/workspace/build/state/armv7hf
SYSROOT=/workspace/build/state/armv7hf/sysroot
BIN_DIR=/workspace/build/state/armv7hf/bin

# Compilers
CC=${BIN_DIR}/${TARGET_TRIPLE}-clang
CXX=${BIN_DIR}/${TARGET_TRIPLE}-clang++
AR=${TOOLCHAIN_DIR}/bin/llvm-ar
RANLIB=${TOOLCHAIN_DIR}/bin/llvm-ranlib
NM=${TOOLCHAIN_DIR}/bin/llvm-nm
LD=${TOOLCHAIN_DIR}/bin/ld.lld
STRIP=${TOOLCHAIN_DIR}/bin/llvm-strip

# Flags
CFLAGS="-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard"
CXXFLAGS="${CFLAGS}"
LDFLAGS="-fuse-ld=lld"

# Build options
MAKEFLAGS=-j24
CMAKE_TOOLCHAIN_FILE=/workspace/armv7hf-toolchain.cmake

# Package output
PKG_DESTDIR=/workspace/build/state/armv7hf/packages
