# AArch64 (ARM64) Profile for Cross-Compilation
# Uses pre-built LLVM/Clang toolchain
#
# NOTE (migration): paths assume the crag-builder container mount at
# /workspace (= repo root); build outputs now live under build/state/.
# TODO(migration): per AD-002 this profile should be regenerated to point
# at the cbuild bldroot toolchain instead of the prebuilt LLVM toolchain.

ARCH=aarch64
TARGET_TRIPLE=aarch64-unknown-linux-musl

# Paths
TOOLCHAIN_DIR=/workspace/toolchain
BUILD_DIR=/workspace/build/state/aarch64
SYSROOT=/workspace/build/state/aarch64/sysroot
BIN_DIR=/workspace/build/state/aarch64/bin

# Compilers
CC=${BIN_DIR}/${TARGET_TRIPLE}-clang
CXX=${BIN_DIR}/${TARGET_TRIPLE}-clang++
AR=${TOOLCHAIN_DIR}/bin/llvm-ar
RANLIB=${TOOLCHAIN_DIR}/bin/llvm-ranlib
NM=${TOOLCHAIN_DIR}/bin/llvm-nm
LD=${TOOLCHAIN_DIR}/bin/ld.lld
STRIP=${TOOLCHAIN_DIR}/bin/llvm-strip

# Flags
CFLAGS="-march=armv8-a"
CXXFLAGS="${CFLAGS}"
LDFLAGS="-fuse-ld=lld"

# Build options
MAKEFLAGS=-j24
CMAKE_TOOLCHAIN_FILE=/workspace/aarch64-toolchain.cmake

# Package output
PKG_DESTDIR=/workspace/build/state/aarch64/packages
